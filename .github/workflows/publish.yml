name: Publish Container Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            runtime/x-use-requirements.lock
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation "x-use-mcp @ git+https://github.com/ihuzaifashoukat/x-use.git@e57e215e45b3e68cbd8cd7c46799cd932c234eac"
      - name: Verify publish input
        run: |
          python scripts/check-repository.py
          bash -n runtime/*.sh
          python -m compileall -q runtime tests scripts
          python -m ruff check runtime tests scripts
          python -m pytest
      - uses: docker/setup-buildx-action@v3
      - name: Build the image that will be published
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/e-eugene/hermes-agent:${{ github.sha }}
            ghcr.io/e-eugene/hermes-agent:staging
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/e-eugene/hermes-agent
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run x-use container smoke
        run: scripts/smoke-x-use-container.sh "ghcr.io/e-eugene/hermes-agent:${{ github.sha }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        run: |
          docker push "ghcr.io/e-eugene/hermes-agent:${{ github.sha }}"
          docker push "ghcr.io/e-eugene/hermes-agent:staging"
