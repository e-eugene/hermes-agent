name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            runtime/x-use-requirements.lock
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation "x-use-mcp @ git+https://github.com/ihuzaifashoukat/x-use.git@e57e215e45b3e68cbd8cd7c46799cd932c234eac"
      - name: Check repository contents
        run: python scripts/check-repository.py
      - name: Check shell syntax
        run: bash -n runtime/*.sh
      - name: Check Python syntax
        run: python -m compileall -q runtime tests scripts
      - name: Lint runtime and tests
        run: python -m ruff check runtime tests scripts
      - name: Run tests
        run: python -m pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: hermes-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run x-use container smoke
        run: scripts/smoke-x-use-container.sh hermes-agent:ci
