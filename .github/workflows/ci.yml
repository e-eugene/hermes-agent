name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check repository contents
        run: python scripts/check-repository.py
      - name: Check shell syntax
        run: bash -n runtime/*.sh
      - name: Check Python syntax
        run: python -m compileall -q runtime tests scripts
      - name: Run tests
        run: python -m pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: hermes-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

